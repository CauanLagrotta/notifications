spring:
    application:
        name: notifications

server:
    port: 5007

spring.datasource:
    url: jdbc:mysql://localhost:3306/notificationsdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

spring.jpa:
    hibernate:
        ddl-auto: none
    show-sql: true

spring.flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true

spring.eureka:
    instance:
        prefer-ip-address: true
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8070/eureka/

spring.management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            show-details: always
            probes:
                enabled: true
