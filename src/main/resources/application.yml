server:
    port: 5007

spring:
    application:
        name: notifications
    datasource:
        url: jdbc:mysql://localhost:3306/notificationsdb
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
    flyway:
        enabled: true
        locations: classpath:db/migration
        baselineOnMigrate: true
    rabbitmq:
        port: 5672
        host: localhost
        username: root
        password: root
    eureka:
        instance:
            prefer-ip-address: true
        client:
            register-with-eureka: true
            fetch-registry: true
            service-url:
                defaultZone: http://localhost:8070/eureka/
    management:
        endpoints:
            web:
                exposure:
                    include: health
        endpoint:
            health:
                show-details: always
                probes:
                    enabled: true